name: Torch OSQP core

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            torch: "torch==2.8.0"
          - os: ubuntu-latest
            python: "3.12"
            torch: "torch"
          - os: ubuntu-latest
            python: "3.13"
            torch: "torch"
          - os: windows-latest
            python: "3.10"
            torch: "torch==2.8.0"
          - os: windows-latest
            python: "3.12"
            torch: "torch"
          - os: macos-latest
            python: "3.10"
            torch: "torch==2.8.0"
          - os: macos-latest
            python: "3.12"
            torch: "torch"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU test environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python -m pip install "${{ matrix.torch }}"
          else
            python -m pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install numpy scipy osqp pytest gurobipy
          python -m pip install -e . --no-deps
      - name: Run deterministic and end-to-end gates
        run: python -m pytest tests -q
